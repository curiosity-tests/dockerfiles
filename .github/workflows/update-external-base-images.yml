name: Update external base images
run-name: "Update external base images ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""


env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  update-docker-files:
    if: github.repository == 'demisto/dockerfiles'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v2
      - env:
          REPO_NAME: ${{ github.repository }}
        run: echo "💡 The $REPO_NAME repository has been cloned to the runner."
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Setup Poetry
        uses: Gr1N/setup-poetry@15821dc8a61bc630db542ae4baf6a7c19a994844 # v8
      - name: run
        env:
          DISABLE_TIMESTAMP_AUTOUPDATES: ${{ vars.DISABLE_TIMESTAMP_AUTOUPDATES }}
        run: |
            git config --global user.email ""
            git config --global user.name "auto dockerfiles update"
            echo "==== $(date): Starting pipenv setup... ===="
            python -m pip install --upgrade pip
            pip install pipenv==2024.4.0
            pipenv install --python=$(which python)
            echo "==== Finished ===="
            [[ "$DISABLE_TIMESTAMP_AUTOUPDATES" = 'true' ]] && tu_flag="--no-timestamp-updates"
            echo tu_flag being passed is $tu_flag
            pipenv run python ./utils/auto_dockerfile_update/update_dockerfiles.py $tu_flag
            echo "Done!"


